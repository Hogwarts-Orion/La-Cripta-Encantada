    gift: { 1: 30000, 3: 85000, 6: 170000, 10: 300000 }
  };

  const REGLAS_TEXTO = `╭─── ⋆｡°✩🎃✩°｡⋆ ───╮
🩸 𝕷𝖆 𝕮𝖗𝖎𝖕𝖙𝖆 𝕰𝖓𝖈𝖆𝖓𝖙𝖆𝖉𝖆 🕸️
   🍬 𝐃𝐔𝐋𝐂𝐄𝐒 𝐌𝐀𝐋𝐃𝐈𝐓𝐎𝐒

  let modoActual = 'personal';
  let cantidadActual = 1;
  let dulcesEnJuego = [];
  let historial = JSON.parse(localStorage.getItem('hogwarts_cripta_historial') || '[]');
  let isSavingToFirebase = false;

  function toast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2600);
  }

  function irAlHistorial() {
    const sec = document.getElementById('seccion-historial');
    if (sec) sec.scrollIntoView({ behavior: 'smooth' });
  }

  function cambiarModo(modo) {
    modoActual = modo;
    document.getElementById('btn-mode-personal').className = 'btn-toggle' + (modo === 'personal' ? ' active' : '');
    document.getElementById('btn-mode-gift').className = 'btn-toggle' + (modo === 'gift' ? ' active gift-mode' : '');
    
    document.getElementById('box-personal-house').style.display = modo === 'personal' ? 'flex' : 'none';
    document.getElementById('box-gift-config').style.display = modo === 'gift' ? 'block' : 'none';
    
    actualizarPreciosUI();
  }

  function seleccionarCantidad(num) {
    cantidadActual = num;
    [1, 3, 6, 10].forEach(n => {
      const el = document.getElementById(`card-qty-${n}`);
      if (el) el.className = 'qty-card' + (n === num ? ' selected' : '');
    });
    actualizarPreciosUI();
  }

  function actualizarPreciosUI() {
    const p = PRECIOS[modoActual];
    document.getElementById('lbl-price-1').innerText = p[1].toLocaleString('es-ES') + ' G';
    document.getElementById('lbl-price-3').innerText = p[3].toLocaleString('es-ES') + ' G';
    document.getElementById('lbl-price-6').innerText = p[6].toLocaleString('es-ES') + ' G';
    document.getElementById('lbl-price-10').innerText = p[10].toLocaleString('es-ES') + ' G';
    document.getElementById('lbl-total-price').innerText = p[cantidadActual].toLocaleString('es-ES') + ' G';
  }

  function renderCatalogo() {
    const cont = document.getElementById('catalogo-grid');
    if (!cont) return;
    cont.innerHTML = '';
    DULCES.forEach(d => {
      const item = document.createElement('div');
      item.style.cssText = 'background:#090414; border:1px solid #3b1b68; border-radius:10px; padding:6px 10px; font-size:0.75rem; display:flex; align-items:center; gap:6px;';
      item.innerHTML = `<span style="font-size:1.1rem;">${d.emoji.split(' ')[0]}</span> <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#e2e8f0;">${d.name}</span>`;
      cont.appendChild(item);
    });
  }

  function randomStep(min, max, step = 500) {
    const count = Math.floor((max - min) / step);
    return min + Math.floor(Math.random() * (count + 1)) * step;
  }

  function generarResultadoDulce(dulce) {
    const isPositive = Math.random() >= 0.70;
    const casasList = ['Extraño Mundo', 'La Otra Casa', 'Salem', 'Transylvania'];
    const randomHouse = casasList[Math.floor(Math.random() * casasList.length)];
    const autoReveal = document.getElementById('chk-auto-reveal').checked;

    if (isPositive) {
      const roll = Math.random();
      if (roll < 0.40) {
        const pts = randomStep(1000, 30000);
        return {
          dulce, isPositive: true, type: 'points', title: `+${pts.toLocaleString('es-ES')} Puntos ✨`,
          desc: '¡Bendición de la Cripta! Has cosechado energía mágica.', ptsDelta: pts, galDelta: 0, revealed: autoReveal
        };
      } else if (roll < 0.80) {
        const gal = randomStep(1000, 30000);
        return {
          dulce, isPositive: true, type: 'galleons', title: `+${gal.toLocaleString('es-ES')} Galeones 💰`,
          desc: '¡Oro de ultratumba! El cofre espectral premia al comprador.', ptsDelta: 0, galDelta: gal, revealed: autoReveal
        };
      } else if (roll < 0.90) {
        return {
          dulce, isPositive: true, type: 'steal', title: `¡Quitar 20.000 pts a una casa! ⚔️`,
          desc: `Poder oscuro otorgado: puedes quitarle 20.000 puntos a una casa rival.`, ptsDelta: 0, galDelta: 0,
          targetHouse: randomHouse, revealed: autoReveal
        };
      } else {
        return {
          dulce, isPositive: true, type: 'gift_curse', title: `¡Suerte Maldita: Dulce de Regalo! 🎁`,
          desc: `Puedes elegir a cualquier persona para regalarle un dulce.`, ptsDelta: 0, galDelta: 0,
          targetPerson: '', revealed: autoReveal
        };
      }
    } else {
      const roll = Math.random();
      if (roll < 0.38) {
        const pts = randomStep(1000, 30000);
        return {
          dulce, isPositive: false, type: 'points', title: `-${pts.toLocaleString('es-ES')} Puntos ☠️`,
          desc: '¡Veneno fantasmal! Los espíritus drenan puntos.', ptsDelta: -pts, galDelta: 0, revealed: autoReveal
        };
      } else if (roll < 0.76) {
        const gal = randomStep(1000, 30000);
        return {
          dulce, isPositive: false, type: 'galleons', title: `-${gal.toLocaleString('es-ES')} Galeones 💸`,
          desc: '¡Tributo sepulcral! El comprador pierde galeones.', ptsDelta: 0, galDelta: -gal, revealed: autoReveal
        };
      } else if (roll < 0.88) {
        return {
          dulce, isPositive: false, type: 'dark_exchange', title: `-10.000 Pts ⟶ Intercambio Oscuro 🔄`,
          desc: `Pierdes 10.000 puntos y otra casa elegida los recibe.`, ptsDelta: -10000, galDelta: 0,
          targetHouse: randomHouse, revealed: autoReveal
        };
      } else {
        return {
          dulce, isPositive: false, type: 'shared_curse', title: `-10.000 Pts ⟶ Maldición Compartida 🩸`,
          desc: `Pierdes 10.000 puntos y otra casa elegida pierde 5.000 puntos.`, ptsDelta: -10000, galDelta: 0,
          targetHouse: randomHouse, revealed: autoReveal
        };
      }
    }
  }

  function generarDulces() {
    const cliente = document.getElementById('txt-cliente').value.trim();
    if (!cliente) {
      toast('⚠️ Ingresa el nombre o @usuario de la víctima (cliente)');
    }

    const shuffled = [...DULCES].sort(() => Math.random() - 0.5);
    dulcesEnJuego = [];
    for (let i = 0; i < cantidadActual; i++) {
      const d = shuffled[i % shuffled.length];
      dulcesEnJuego.push(generarResultadoDulce(d));
    }

    document.getElementById('candies-section').style.display = 'block';
    document.getElementById('lbl-candies-count').innerText = `🍬 Dulces Malditos en Juego (${cantidadActual})`;

    renderDulcesCards();
    document.getElementById('candies-section').scrollIntoView({ behavior: 'smooth' });
  }

  function getHouseOptions(selected) {
    return CASAS.map(c => `<option value="${c.id}" ${selected === c.id ? 'selected' : ''}>${c.name}</option>`).join('');
  }

  function renderDulcesCards() {
    const cont = document.getElementById('candies-container');
    cont.innerHTML = '';
    cont.className = 'candies-grid' + (cantidadActual === 1 ? ' single' : '');

    dulcesEnJuego.forEach((item, index) => {
      const card = document.createElement('div');
      if (!item.revealed) {
        card.className = 'candy-card';
        card.onclick = () => morderDulce(index);
        card.innerHTML = `
          <div class="card-top-tag">
            <span>PIEZA #${index + 1}</span>
            <span style="color:var(--gold);">SELLADO</span>
          </div>
          <div class="unopened-icon">🎃</div>
          <div style="font-size:0.75rem; text-align:center; color:#94a3b8; font-style:italic; margin-bottom:12px;">¿Premio de gloria o maldición?</div>
          <button class="btn-bite-action" onclick="event.stopPropagation(); morderDulce(${index})">¡Morder Dulce! 🩸</button>
        `;
      } else {
        card.className = `candy-card revealed ${item.isPositive ? 'positive' : 'negative'}`;
        let extraHtml = '';
        if (item.type === 'steal' || item.type === 'dark_exchange' || item.type === 'shared_curse') {
          const labelTxt = item.type === 'steal' ? 'Casa a la que se le quitan 20.000 pts:' : (item.type === 'dark_exchange' ? 'Casa que recibe los 10.000 pts:' : 'Casa cómplice (pierde 5.000 pts):');
          extraHtml = `
            <div style="margin-top:6px; font-size:0.7rem; color:var(--gold);">
              ${labelTxt}
              <select class="select-target-house" onchange="dulcesEnJuego[${index}].targetHouse = this.value">
                ${getHouseOptions(item.targetHouse)}
              </select>
            </div>`;
        } else if (item.type === 'gift_curse') {
          extraHtml = `
            <div style="margin-top:6px; font-size:0.7rem; color:var(--gold);">
              Estudiante para regalarle un dulce:
              <input type="text" class="input-target-person" placeholder="@usuario o Nombre" value="${item.targetPerson || ''}" oninput="dulcesEnJuego[${index}].targetPerson = this.value">
            </div>`;
        }

        card.innerHTML = `
          <div class="card-top-tag">
            <span>#${index + 1} • ${item.isPositive ? '✨ PREMIO' : '☠️ MALDICIÓN'}</span>
            <span>${item.dulce.emoji.split(' ')[0]}</span>
          </div>
          <div>
            <div class="revealed-name">${item.dulce.emoji} ${item.dulce.name}</div>
            <div class="revealed-lore">"${item.dulce.lore}"</div>
          </div>
          <div class="outcome-pill ${item.isPositive ? 'pos' : 'neg'}">
            <div class="outcome-pill-title">${item.title}</div>
            <div class="outcome-pill-desc">${item.desc}</div>
          </div>
          ${extraHtml}
          <div style="display:flex; justify-content:space-between; font-size:0.72rem; font-family:monospace; margin-top:8px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
            <span style="color:${item.ptsDelta > 0 ? '#34d399' : (item.ptsDelta < 0 ? '#f87171' : '#64748b')}">${item.ptsDelta !== 0 ? (item.ptsDelta > 0 ? '+' : '') + item.ptsDelta.toLocaleString('es-ES') + ' pts' : '—'}</span>
            <span style="color:${item.galDelta > 0 ? '#fde047' : (item.galDelta < 0 ? '#f87171' : '#64748b')}">${item.galDelta !== 0 ? (item.galDelta > 0 ? '+' : '') + item.galDelta.toLocaleString('es-ES') + ' G' : '—'}</span>
          </div>
        `;
      }
      cont.appendChild(card);
    });

    checkSummaryReady();
  }

  function morderDulce(idx) {
    dulcesEnJuego[idx].revealed = true;
    renderDulcesCards();
  }

  function morderTodos() {
    dulcesEnJuego.forEach(d => d.revealed = true);
    renderDulcesCards();
  }

  function checkSummaryReady() {
    const allRev = dulcesEnJuego.length > 0 && dulcesEnJuego.every(d => d.revealed);
    const sumSec = document.getElementById('summary-section');
    if (allRev) {
      sumSec.style.display = 'block';

      let netPts = 0;
      let netGal = 0;
      dulcesEnJuego.forEach(d => {
        netPts += d.ptsDelta;
        netGal += d.galDelta;
      });

      const pEl = document.getElementById('stat-points');
      pEl.innerText = (netPts > 0 ? '+' : '') + netPts.toLocaleString('es-ES') + ' pts';
      pEl.className = 'stat-val ' + (netPts >= 0 ? 'pos' : 'neg');

      const gEl = document.getElementById('stat-galleons');
      gEl.innerText = (netGal > 0 ? '+' : '') + netGal.toLocaleString('es-ES') + ' G';
      gEl.className = 'stat-val ' + (netGal >= 0 ? 'pos' : 'neg');

      const cost = PRECIOS[modoActual][cantidadActual];
      document.getElementById('stat-cost').innerText = cost.toLocaleString('es-ES') + ' G';
      document.getElementById('stat-mode-hint').innerText = modoActual === 'gift' ? 'Regalo entre Casas' : 'Compra Personal';
    } else {
      sumSec.style.display = 'none';
    }
  }

  function generarTicketTexto() {
    const clienteInput = document.getElementById('txt-cliente');
    const clienteRaw = (clienteInput ? clienteInput.value.trim() : '') || 'Víctima';
    const trabajadorInput = document.getElementById('txt-trabajador');
    const trabajador = (trabajadorInput ? trabajadorInput.value.trim() : '') || 'Sepulturero';
    const cost = (PRECIOS[modoActual] && PRECIOS[modoActual][cantidadActual]) ? PRECIOS[modoActual][cantidadActual] : 12500;
    const clientTag = clienteRaw.startsWith('@') ? clienteRaw : `@${clienteRaw}`;

    let txt = `╭─── ⋆｡°✩🎃✩°｡⋆ ───╮\n`;
    txt += `🩸 𝕷𝖆 𝕮𝖗𝖎𝖕𝖙𝖆 𝕰𝖓𝖈𝖆𝖓𝖙𝖆𝖉𝖆 🕸️\n`;
    txt += `   🍬 𝐃𝐔𝐋𝐂𝐄𝐒 𝐌𝐀𝐋𝐃𝐈𝐓𝐎𝐒\n`;
    txt += `╰─── ⋆｡°✩🎃✩°｡⋆ ───╯\n\n`;

    txt += `👤 Víctima: ${clientTag}\n`;
    txt += `🧛🏻 Atendido por: ${trabajador}\n`;

    if (modoActual === 'gift') {
      const bH = document.getElementById('sel-gift-buyer').value;
      const rH = document.getElementById('sel-gift-receiver').value;
      txt += `🛍️ Modalidad: REGALO ENTRE CASAS\n`;
      txt += `🏰 Casa Compradora: ${bH}\n`;
      txt += `🎯 Casa Destinataria: ${rH}\n`;
      txt += `💰 Costo abonado: ${cost.toLocaleString('es-ES')} G\n`;
      txt += `⚠️ Nota: Los galeones afectan siempre al comprador (${bH}).\n\n`;
    } else {
      const bH = document.getElementById('sel-buyer-house').value;
      txt += `🛍️ Modalidad: COMPRA PERSONAL\n`;
      txt += `🏰 Casa: ${bH}\n`;
      txt += `💰 Costo abonado: ${cost.toLocaleString('es-ES')} G\n\n`;
    }

    txt += `──────── ⋆｡°🍬°｡⋆ ────────\n`;

    let netPts = 0;
    let netGal = 0;
    const specials = [];

    dulcesEnJuego.forEach((item, i) => {
      netPts += item.ptsDelta;
      netGal += item.galDelta;
      const prefix = item.isPositive ? '✨ [PREMIO]' : '☠️ [MALDICIÓN]';
      txt += `🍬 Dulce ${i + 1}: ${item.dulce.emoji} *${item.dulce.name}*\n`;
      txt += `   ↳ ${prefix} ${item.title}\n`;

      if (item.type === 'steal') {
        const target = item.targetHouse ? `a la Casa ${item.targetHouse}` : 'a una Casa a elección';
        specials.push(`⚔️ Quitar 20.000 puntos ${target}`);
        txt += `   ↳ 🩸 Efecto: Quita 20.000 puntos ${target}\n`;
      } else if (item.type === 'gift_curse') {
        const rec = item.targetPerson ? `para ${item.targetPerson}` : '(A designar)';
        specials.push(`🎁 Suerte Maldita: 1 dulce de regalo ${rec}`);
        txt += `   ↳ 🎃 Efecto: Elige a una persona para regalarle un dulce ${rec}\n`;
      } else if (item.type === 'dark_exchange') {
        const target = item.targetHouse ? `a ${item.targetHouse}` : 'a otra Casa';
        specials.push(`🔄 Intercambio Oscuro: -10.000 pts víctima y se transfieren ${target}`);
        txt += `   ↳ 🔄 Efecto: Pierde 10.000 puntos y ${target} los recibe\n`;
      } else if (item.type === 'shared_curse') {
        const target = item.targetHouse ? `a ${item.targetHouse}` : 'a otra Casa';
        specials.push(`🩸 Maldición Compartida: -10.000 pts víctima y -5.000 pts ${target}`);
        txt += `   ↳ 🩸 Efecto: Pierde 10.000 puntos y ${target} pierde 5.000 puntos\n`;
      }
      txt += `\n`;
    });

    txt += `──────── ⋆｡°🎃°｡⋆ ────────\n`;
    txt += `📊 *BALANCE TOTAL DE LA CRIPTA:*\n`;
    txt += `✨ Puntos netos: *${(netPts > 0 ? '+' : '') + netPts.toLocaleString('es-ES')} pts*\n`;
    txt += `💰 Galeones netos: *${(netGal > 0 ? '+' : '') + netGal.toLocaleString('es-ES')} G* (Afecta al comprador)\n`;

    if (specials.length > 0) {
      txt += `\n⚠️ *EFECTOS ESPECIALES ACTIVADOS:*\n`;
      specials.forEach(s => txt += `• ${s}\n`);
    }

    txt += `\n🕸️ *Hogwarts Orión • La Cripta Encantada 2026* 🎃`;
    return txt;
  }

  function copiarTicketActual() {
    const ticket = generarTicketTexto();
    navigator.clipboard.writeText(ticket).then(() => {
      toast('¡Ticket copiado para WhatsApp! 📋');
    }).catch(() => {
      toast('⚠️ Selecciona y copia el ticket manualmente');
    });
  }

  // =========================================================================
  // GUARDAR Y SINCRONIZAR HISTORIAL CON FIREBASE Y MOSTRARLO EN LA PÁGINA
  // =========================================================================

  async function guardarEnHistorial() {
    if (isSavingToFirebase) return;

    const cliente = document.getElementById('txt-cliente').value.trim() || 'Víctima';
    const trabajador = document.getElementById('txt-trabajador').value.trim() || 'Sepulturero';
    const cost = PRECIOS[modoActual][cantidadActual];
    const ticket = generarTicketTexto();
    const now = new Date();
    const dateStr = now.toLocaleDateString('es-ES');
    const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

    let netPts = 0;
    let netGal = 0;
    const specialsList = [];

    dulcesEnJuego.forEach(d => {
      netPts += d.ptsDelta;
      netGal += d.galDelta;
      if (d.type === 'steal') specialsList.push(`Quitar 20.000 pts a ${d.targetHouse || 'casa'}`);
      if (d.type === 'gift_curse') specialsList.push(`Dulce de regalo para ${d.targetPerson || 'alumno a designar'}`);
      if (d.type === 'dark_exchange') specialsList.push(`Intercambio oscuro con ${d.targetHouse || 'casa'}`);
      if (d.type === 'shared_curse') specialsList.push(`Maldición compartida con ${d.targetHouse || 'casa'}`);
    });

    const bH = modoActual === 'personal' ? document.getElementById('sel-buyer-house').value : document.getElementById('sel-gift-buyer').value;
    const rH = modoActual === 'gift' ? document.getElementById('sel-gift-receiver').value : null;

    const record = {
      id: Date.now().toString(),
      timestamp: Date.now(),
      client: cliente,
      cliente: cliente,
      worker: trabajador,
      trabajador: trabajador,
      date: dateStr,
      fecha: dateStr,
      time: timeStr,
      mode: modoActual,
      modalidad: modoActual,
      buyerHouse: bH,
      casa: bH,
      receiverHouse: rH,
      quantity: cantidadActual,
      cost: cost,
      costo: cost,
      totalCostGalleons: cost,
      netPoints: netPts,
      balancePuntos: netPts,
      netGalleons: netGal,
      balanceGaleones: netGal,
      specials: specialsList,
      candies: dulcesEnJuego.map(d => ({
        name: d.dulce.name,
        emoji: d.dulce.emoji,
        isPositive: d.isPositive,
        title: d.title,
        ptsDelta: d.ptsDelta,
        galDelta: d.galDelta
      })),
      ticket: ticket,
      summaryText: ticket
    };

    // 1. Guardar primero en memoria y localStorage para que sea instantáneo
    historial.unshift(record);
    localStorage.setItem('hogwarts_cripta_historial', JSON.stringify(historial));
    renderHistorial();
    actualizarMetricas();

    // Feedback visual del botón de guardado
    const btnSave = document.getElementById('btn-save-record');
    const btnText = document.getElementById('btn-save-text');
    const btnIcon = document.getElementById('btn-save-icon');
    
    isSavingToFirebase = true;
    if (btnText) btnText.innerText = 'Guardando en Firebase... ⏳';
    if (btnIcon) btnIcon.innerText = '⏳';

    setFirebaseBadge('syncing', 'Subiendo a Firebase...');

    try {
      const response = await fetch(RTDB_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(record)
      });

      if (response.ok) {
        const data = await response.json();
        record.firebaseKey = data.name;
        localStorage.setItem('hogwarts_cripta_historial', JSON.stringify(historial));
        setFirebaseBadge('connected', 'Conectado a Firebase 🟢');
        toast('¡Guardado en la página y en Firebase! 📜✨');
      } else {
        setFirebaseBadge('offline', 'Modo local (Error al subir a Firebase)');
        toast('Guardado localmente en la página (aviso Firebase)');
      }
    } catch (err) {
      console.warn('Error al guardar en Firebase:', err);
      setFirebaseBadge('offline', 'Modo local (Sin conexión)');
      toast('Guardado en la página localmente');
    } finally {
      isSavingToFirebase = false;
      if (btnText) btnText.innerText = '¡Guardado con éxito! ✅';
      if (btnIcon) btnIcon.innerText = '✅';
      setTimeout(() => {
        if (btnText) btnText.innerText = 'Guardar en Historial y Firebase';
        if (btnIcon) btnIcon.innerText = '💾';
      }, 2500);

      irAlHistorial();
    }
  }

  async function cargarHistorialFirebase(manualRefresh = false) {
    setFirebaseBadge('syncing', manualRefresh ? 'Sincronizando...' : 'Cargando Firebase...');
    
    try {
      const res = await fetch(RTDB_URL);
      if (!res.ok) throw new Error('Respuesta no válida de Firebase');
      const data = await res.json();

      if (data && typeof data === 'object') {
        const cloudRecords = Object.keys(data)
          .filter(key => data[key] && typeof data[key] === 'object')
          .map(key => {
            const raw = data[key];
            const clientVal = String(raw.client || raw.cliente || 'Víctima').trim();
            const workerVal = String(raw.worker || raw.trabajador || 'Sepulturero').trim();
            const modeVal = raw.mode || raw.modalidad || 'personal';
            const costVal = raw.totalCostGalleons || raw.costo || raw.cost || 0;
            const netPointsVal = (raw.netPoints !== undefined) ? raw.netPoints : (raw.balancePuntos !== undefined ? raw.balancePuntos : 0);
            const netGalleonsVal = (raw.netGalleons !== undefined) ? raw.netGalleons : (raw.balanceGaleones !== undefined ? raw.balanceGaleones : 0);
            const formattedDate = raw.formattedDate || raw.fecha || raw.date || '25/09';
            const timeVal = raw.time || '';
            const summaryText = raw.summaryText || raw.ticket || '';
            
            let buyerHouse = raw.buyerHouse || raw.casa || '';
            let receiverHouse = raw.receiverHouse || '';
            
            if (!buyerHouse && summaryText) {
              if (summaryText.includes('Extraño Mundo')) buyerHouse = 'Extraño Mundo 🧡🎃';
              else if (summaryText.includes('La Otra Casa')) buyerHouse = 'La Otra Casa 🩶🪡';
              else if (summaryText.includes('Salem')) buyerHouse = 'Salem 🖤🧹';
              else if (summaryText.includes('Transylvania')) buyerHouse = 'Transylvania 🤎🦇';
            }
            if (!buyerHouse) buyerHouse = 'Extraño Mundo 🧡🎃';

            return {
              id: raw.id ? String(raw.id) : key,
              firebaseKey: key,
              timestamp: raw.timestamp || (typeof raw.id === 'number' ? raw.id : Date.now()),
              formattedDate: formattedDate,
              fecha: formattedDate,
              date: formattedDate,
              time: timeVal,
              client: clientVal,
              cliente: clientVal,
              worker: workerVal,
              trabajador: workerVal,
              mode: modeVal,
              modalidad: modeVal,
              buyerHouse: buyerHouse,
              casa: buyerHouse,
              receiverHouse: receiverHouse,
              quantity: raw.quantity || 1,
              cost: costVal,
              costo: costVal,
              totalCostGalleons: costVal,
              netPoints: netPointsVal,
              balancePuntos: netPointsVal,
              netGalleons: netGalleonsVal,
              balanceGaleones: netGalleonsVal,
              candies: Array.isArray(raw.candies) ? raw.candies : [],
              specials: Array.isArray(raw.specials) ? raw.specials : [],
              summaryText: summaryText,
              ticket: summaryText
            };
          });

        const mapById = new Map();
        cloudRecords.forEach(r => mapById.set(r.id || r.firebaseKey, r));
        
        historial.forEach(localRec => {
          if (!localRec) return;
          const key = localRec.id || localRec.firebaseKey;
          if (key && !mapById.has(key)) {
            mapById.set(key, localRec);
          }
        });

        historial = Array.from(mapById.values());
        historial.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        localStorage.setItem('hogwarts_cripta_historial', JSON.stringify(historial));
        setFirebaseBadge('connected', `Conectado a Firebase 🟢 (${cloudRecords.length} registros)`);
        if (manualRefresh) toast('¡Historial sincronizado con Firebase! 🔄');
      } else {
        setFirebaseBadge('connected', 'Conectado a Firebase 🟢 (0 registros en nube)');
      }
    } catch (err) {
      console.warn('No se pudo conectar a Firebase:', err);
      setFirebaseBadge('offline', 'Modo Local (Sin conexión Firebase)');
      if (manualRefresh) toast('Mostrando historial local (sin conexión a Firebase)');
    }

    renderHistorial();
    actualizarMetricas();
  }

  function setFirebaseBadge(status, text) {
    const badge = document.getElementById('firebase-status-badge');
    const label = document.getElementById('firebase-status-text');
    if (!badge || !label) return;
    badge.className = `sync-status-badge ${status}`;
    label.innerText = text;
  }

  function renderHistorial(lista = null) {
    const cont = document.getElementById('history-list');
    if (!cont) return;

    const items = lista || historial;

    if (!items || items.length === 0) {
      cont.innerHTML = `
        <div class="history-empty-state">
          <span class="icon">🕯️</span>
          <div style="font-weight:700; color:#e2e8f0; margin-bottom:4px;">Aún no hay registros en la Cripta</div>
          <div style="font-size:0.78rem;">Realiza una tirada arriba y presiona "Guardar en Historial y Firebase" para verla reflejada aquí en la página.</div>
        </div>
      `;
      return;
    }

    cont.innerHTML = '';
    items.forEach((item, index) => {
      if (!item) return;
      const card = document.createElement('div');
      card.className = 'history-card-item';

      const rawClient = String(item.client || item.cliente || 'Víctima').trim();
      const clientClean = rawClient.startsWith('@') ? rawClient : `@${rawClient || 'Víctima'}`;
      const isGift = (item.mode === 'gift' || item.modalidad === 'gift');
      const bHouse = item.buyerHouse || item.casa || 'Sin casa';
      const rHouse = item.receiverHouse || 'Sin casa';
      const houseLabel = isGift ? `${bHouse} ➔ ${rHouse}` : bHouse;

      let candiesHtml = '';
      if (item.candies && Array.isArray(item.candies)) {
        candiesHtml = item.candies.map(c => `
          <span class="candy-mini-pill ${c.isPositive ? 'is-pos' : 'is-neg'}" title="${c.title || ''}">
            <span>${c.emoji ? c.emoji.split(' ')[0] : '🍬'}</span>
            <span>${c.name || 'Dulce'}</span>
          </span>
        `).join('');
      }

      let specialsHtml = '';
      if (item.specials && Array.isArray(item.specials) && item.specials.length > 0) {
        specialsHtml = `
          <div class="specials-alert-box">
            <strong>⚠️ Efectos Especiales:</strong> ${item.specials.join(' • ')}
          </div>
        `;
      }

      const pts = (item.netPoints !== undefined) ? item.netPoints : (item.balancePuntos || 0);
      const gal = (item.netGalleons !== undefined) ? item.netGalleons : (item.balanceGaleones || 0);
      const costVal = (item.cost !== undefined) ? item.cost : (item.costo || item.totalCostGalleons || 0);
      const ptsClass = pts > 0 ? 'pos' : (pts < 0 ? 'neg' : 'gold');
      const galClass = gal > 0 ? 'pos' : (gal < 0 ? 'neg' : 'gold');
      const dateDisplay = item.date || item.fecha || item.formattedDate || '';
      const timeDisplay = item.time || '';
      const ticketTxt = item.ticket || item.summaryText || '';
      const workerName = item.worker || item.trabajador || 'Encargado';

      card.innerHTML = `
        <div class="history-card-header">
          <div>
            <div class="history-client-name">
              <span>👤</span> ${clientClean}
            </div>
            <div style="font-size:0.72rem; color:#94a3b8; margin-top:2px;">
              🧛🏻 Atendido por: <strong>${workerName}</strong>
            </div>
          </div>

          <div class="history-meta-tag">
            <span class="house-pill-tag">${isGift ? '🎁 Regalo' : '👤 Personal'}</span>
            <span class="house-pill-tag" style="background:#1e1038;">🏰 ${houseLabel}</span>
            <span style="color:#64748b; font-family:monospace;">${dateDisplay} ${timeDisplay}</span>
          </div>
        </div>

        <div class="history-details-grid">
          <div>
            <div class="history-badges-row">
              <span class="badge-stat ${ptsClass}">
                ${pts > 0 ? '+' : ''}${pts.toLocaleString('es-ES')} pts
              </span>
              <span class="badge-stat ${galClass}">
                ${gal > 0 ? '+' : ''}${gal.toLocaleString('es-ES')} G
              </span>
              <span class="badge-stat gold">
                Costo: ${costVal.toLocaleString('es-ES')} G
              </span>
              <span style="font-size:0.72rem; color:#94a3b8;">
                🍬 ${item.quantity || 1} dulce(s)
              </span>
            </div>

            ${candiesHtml ? `<div class="candies-mini-list">${candiesHtml}</div>` : ''}
            ${specialsHtml}
          </div>
        </div>

        <div class="history-card-actions">
          <button class="btn-ticket-action" onclick="toggleTicketDrawer('${item.id}')">
            <span>👁️</span> Ver Ticket
          </button>
          <button class="btn-ticket-action copy-main" onclick="copiarHistorialItem('${item.id}')">
            <span>📋</span> Copiar WhatsApp
          </button>
          <button class="btn-ticket-action del" onclick="eliminarRegistro('${item.id}', '${item.firebaseKey || ''}')" title="Eliminar registro">
            <span>🗑️</span>
          </button>
        </div>

        <div id="drawer-${item.id}" class="ticket-raw-drawer">${ticketTxt}</div>
      `;

      cont.appendChild(card);
    });
  }

  function toggleTicketDrawer(id) {
    const d = document.getElementById(`drawer-${id}`);
    if (!d) return;
    d.classList.toggle('open');
  }

  function copiarHistorialItem(id) {
    const item = historial.find(h => h && h.id == id);
    const ticketTxt = item ? (item.ticket || item.summaryText || '') : '';
    const clientName = item ? (item.client || item.cliente || 'Víctima') : 'Víctima';
    if (ticketTxt) {
      navigator.clipboard.writeText(ticketTxt).then(() => {
        toast(`¡Ticket de ${clientName} copiado para WhatsApp! 📋`);
      }).catch(() => {
        toast('No se pudo copiar automáticamente');
      });
    }
  }

  async function eliminarRegistro(id, firebaseKey) {
    if (!confirm('¿Eliminar este registro de la Cripta?')) return;

    historial = historial.filter(h => h && h.id != id);
    localStorage.setItem('hogwarts_cripta_historial', JSON.stringify(historial));
    renderHistorial();
    actualizarMetricas();
    toast('Registro eliminado de la página 🗑️');

    if (firebaseKey) {
      try {
        const deleteUrl = `https://la-cripta-encantada-af0fa-default-rtdb.firebaseio.com/historial/${firebaseKey}.json`;
        await fetch(deleteUrl, { method: 'DELETE' });
      } catch (e) {
        console.warn('Error al borrar de Firebase:', e);
      }
    }
  }

  function filtrarHistorial() {
    const searchEl = document.getElementById('txt-search-history');
    const query = searchEl ? searchEl.value.toLowerCase().trim() : '';
    const houseEl = document.getElementById('sel-filter-house');
    const houseFilter = houseEl ? houseEl.value : 'ALL';

    const filtrados = historial.filter(item => {
      if (!item) return false;
      const cStr = String(item.client || item.cliente || '').toLowerCase();
      const wStr = String(item.worker || item.trabajador || '').toLowerCase();
      const bStr = String(item.buyerHouse || item.casa || '').toLowerCase();
      const rStr = String(item.receiverHouse || '').toLowerCase();

      const matchText = (
        cStr.includes(query) ||
        wStr.includes(query) ||
        bStr.includes(query) ||
        rStr.includes(query)
      );

      const matchHouse = houseFilter === 'ALL' || 
        bStr.includes(houseFilter.toLowerCase()) || 
        rStr.includes(houseFilter.toLowerCase());

      return matchText && matchHouse;
    });

    renderHistorial(filtrados);
  }

  function actualizarMetricas() {
    const totalOrdersEl = document.getElementById('metric-total-orders');
    const totalPointsEl = document.getElementById('metric-total-points');
    const totalGalEl = document.getElementById('metric-total-galleons');

    if (!totalOrdersEl) return;

    let pts = 0;
    let gal = 0;
    historial.forEach(h => {
      if (!h) return;
      pts += (h.netPoints !== undefined ? h.netPoints : (h.balancePuntos || 0));
      gal += (h.netGalleons !== undefined ? h.netGalleons : (h.balanceGaleones || 0));
    });

    totalOrdersEl.innerText = historial.length;
    totalPointsEl.innerText = (pts > 0 ? '+' : '') + pts.toLocaleString('es-ES') + ' pts';
    totalGalEl.innerText = (gal > 0 ? '+' : '') + gal.toLocaleString('es-ES') + ' G';
  }

  async function limpiarHistorial() {
    if (confirm('¿Deseas purgar todo el historial de la Cripta en la página?')) {
      historial = [];
      localStorage.removeItem('hogwarts_cripta_historial');
      renderHistorial();
      actualizarMetricas();
      toast('Historial limpiado');
    }
  }

  function abrirModalReglas() {
    document.getElementById('rules-text-content').innerText = REGLAS_TEXTO;
    document.getElementById('rules-modal').className = 'modal-overlay open';
  }

  function cerrarModalReglas() {
    document.getElementById('rules-modal').className = 'modal-overlay';
  }

  function copiarTextoReglas() {
    navigator.clipboard.writeText(REGLAS_TEXTO).then(() => {
      toast('¡Estatuto copiado al portapapeles! 📜');
    });
  }

  // INICIALIZACIÓN ÚNICA
  let appInited = false;
  function initApp() {
    if (appInited) return;
    appInited = true;
    renderCatalogo();
    actualizarPreciosUI();
    renderHistorial();
    actualizarMetricas();
    cargarHistorialFirebase();
  }

  window.addEventListener('DOMContentLoaded', initApp);
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    initApp();
  }
</script>
